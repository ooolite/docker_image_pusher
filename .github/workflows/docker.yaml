name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # 注意：GitHub Actions 用 UTC。北京时间 21:00 = UTC 13:00
  schedule:
    - cron: '0 13 * * *'

# 防止手动/定时任务叠加
concurrency:
  group: docker-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  sync:
    name: Sync Images
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          # remove-android: 'true'
          # remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Disk before sync
        run: df -hT

      # 用官方 action 登录，密码不会出现在命令行/日志里
      - name: Login to Aliyun
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync images
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
        run: |
          set -uo pipefail

          # ---- 解析工具函数（两次循环复用）----
          get_image()    { awk '{print $NF}' <<< "$1"; }
          get_platform() { awk -F'--platform[ =]' '{if (NF>1) print $2}' <<< "$1" | awk '{print $1}'; }

          # 过滤掉注释和空行
          grep -Ev '^[[:space:]]*(#|$)' images.txt > /tmp/images.clean || true

          # ---- Pass 1：检测跨命名空间的同名镜像 ----
          declare -A ns_map=() duplicates=()
          while IFS= read -r line; do
            image=$(get_image "$line"); image="${image%%@*}"
            name_tag="${image##*/}"
            name="${name_tag%%:*}"
            ns="${image%/*}"; [[ "$ns" == "$image" ]] && ns=""
            ns="${ns:-}_"
            if [[ -n "${ns_map[$name]:-}" ]]; then
              [[ "${ns_map[$name]}" != "$ns" ]] && duplicates[$name]=1
            else
              ns_map[$name]="$ns"
            fi
          done < /tmp/images.clean

          # ---- Pass 2：pull / tag / push ----
          total=$(wc -l < /tmp/images.clean)
          idx=0; failures=0
          while IFS= read -r line; do
            idx=$((idx+1))
            image=$(get_image "$line"); image="${image%%@*}"
            platform=$(get_platform "$line")

            name_tag="${image##*/}"
            name="${name_tag%%:*}"
            ns="${image%/*}"; [[ "$ns" == "$image" ]] && ns=""

            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"
            ns_prefix=""
            [[ -n "${duplicates[$name]:-}" && -n "$ns" ]] && ns_prefix="${ns}_"

            dst="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${ns_prefix}${name_tag}"

            echo "::group::[$idx/$total] $line"
            if ! docker pull $line; then
              echo "::error::pull failed: $line"
              failures=$((failures+1)); echo "::endgroup::"; continue
            fi
            docker tag "$image" "$dst"
            if ! docker push "$dst"; then
              echo "::error::push failed: $dst"
              failures=$((failures+1))
            fi
            # 合并成一条命令删除本地两个 tag
            docker rmi "$image" "$dst" >/dev/null 2>&1 || true
            echo "::endgroup::"
          done < /tmp/images.clean

          echo "Disk after sync:"; df -hT

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures image(s) failed"
            exit 1
          fi
