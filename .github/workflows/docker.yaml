name: Docker

on:
  workflow_dispatch:
    inputs:
      force_push:
        description: '强制覆盖（忽略 digest 一致判断）'
        type: boolean
        default: false
  push:
    branches: [ main ]
  schedule:
    # UTC 13:00 = 北京时间 21:00
    - cron: '0 13 * * *'

permissions:
  contents: read

concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
  FORCE_PUSH: ${{ github.event.inputs.force_push == 'true' && 'true' || 'false' }}

jobs:
  sync:
    name: Sync images to Aliyun (digest based)
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull / Tag / Push (skip when digest identical)
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local -i n=0 max=3
            until "$@"; do
              ((n++)) || true
              if (( n >= max )); then
                echo "::error::Command failed after $max attempts: $*"
                return 1
              fi
              echo "Retry $n/$max: $*"
              sleep 5
            done
          }

          # 取某 tag 在指定平台上的内容 digest：
          #  - tag 指向 manifest list/index：返回该平台子 manifest 的 digest
          #  - tag 指向单 manifest：返回它自身原始字节的 sha256（= DCD）
          # 参数: <image> [platform=linux/amd64]
          # 成功 -> stdout 输出 digest；失败 -> 返回 1
          tag_platform_digest() {
            local img="$1" plat="${2:-linux/amd64}"
            local arch="${plat%%/*}" var=""
            [[ "$plat" == */* ]] && var="${plat##*/}"
            local raw
            raw=$(docker buildx imagetools inspect --raw "$img" 2>/dev/null) || return 1
            printf '%s' "$raw" | python3 -c '
          import json,sys,hashlib
          arch,var=sys.argv[1],sys.argv[2] or None
          raw=sys.stdin.read()
          try: d=json.loads(raw)
          except Exception: sys.exit(1)
          if "manifests" in d:
              for m in d["manifests"]:
                  p=m.get("platform",{})
                  if p.get("os")=="linux" and p.get("architecture")==arch and (var is None or p.get("variant")==var):
                      print(m["digest"]); sys.exit(0)
              sys.exit(1)
          print("sha256:"+hashlib.sha256(raw.encode()).hexdigest())
          ' "$arch" "$var"
          }

          # ---------- 读取 images.txt ----------
          lines=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
            lines+=("$line")
          done < images.txt

          if (( ${#lines[@]} == 0 )); then
            echo "No images to process."
            exit 0
          fi

          # ---------- 第一遍：检测镜像名重名 ----------
          declare -A first_ns duplicate
          for line in "${lines[@]}"; do
            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"

            IFS='/' read -r -a parts <<< "$image"
            case "${#parts[@]}" in
              3) name_space="${parts[1]}" ;;
              2) name_space="${parts[0]}" ;;
              *) name_space="" ;;
            esac

            if [[ -n "${first_ns[$image_name]+x}" ]]; then
              if [[ "${first_ns[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate[$image_name]=1
              fi
            else
              first_ns[$image_name]="$name_space"
            fi
          done

          # ---------- 第二遍：digest 比较 → 不一致才推 ----------
          pushed=0
          skipped=0
          failed=()

          for line in "${lines[@]}"; do
            echo "::group::Processing $line"

            platform=""
            if [[ "$line" =~ --platform[=\ ]([^ ]+) ]]; then
              platform="${BASH_REMATCH[1]}"
            fi
            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"
            # 比较/拉取使用的平台：条目有指定就用指定，否则 linux/amd64
            cmp_platform="${platform:-linux/amd64}"

            image=$(awk '{print $NF}' <<< "$line")
            image_clean="${image%%@*}"
            image_name_tag="${image_clean##*/}"
            image_name="${image_name_tag%%:*}"

            IFS='/' read -r -a parts <<< "$image_clean"
            case "${#parts[@]}" in
              3) name_space="${parts[1]}" ;;
              2) name_space="${parts[0]}" ;;
              *) name_space="" ;;
            esac

            name_space_prefix=""
            if [[ -n "${duplicate[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            # ---- 取两端 digest ----
            src_digest=$(tag_platform_digest "$image"     "$cmp_platform" || true)
            if [[ -z "$src_digest" ]]; then
              echo "::error::Cannot resolve source digest: $image ($cmp_platform)"
              failed+=("$image (source digest unavailable)")
              echo "::endgroup::"
              continue
            fi
            dst_digest=$(tag_platform_digest "$new_image" "$cmp_platform" || true)

            echo "src($cmp_platform): $src_digest"
            echo "dst($cmp_platform): ${dst_digest:-<none>}"

            # ---- 判定 ----
            if [[ "$FORCE_PUSH" != "true" && -n "$dst_digest" && "$src_digest" == "$dst_digest" ]]; then
              echo "::notice::Digest identical, skip: $new_image"
              skipped=$((skipped + 1))
              echo "::endgroup::"
              continue
            fi
            if [[ -n "$dst_digest" ]]; then
              echo "::warning::Digest differs, will push: $new_image"
              echo "  src=$src_digest"
              echo "  dst=$dst_digest"
            else
              echo "::notice::Target not found, will push: $new_image"
            fi

            # ---- Pull ----
            echo "Pull: $image"
            if [[ -n "$platform" ]]; then
              retry docker pull --platform "$platform" "$image" \
                || { failed+=("$image (pull)"); echo "::error::Pull failed"; echo "::endgroup::"; continue; }
            else
              retry docker pull "$image" \
                || { failed+=("$image (pull)"); echo "::error::Pull failed"; echo "::endgroup::"; continue; }
            fi

            # ---- Tag + Push ----
            docker tag "$image" "$new_image"
            echo "Push: $new_image"
            if ! retry docker push "$new_image"; then
              failed+=("$new_image (push)")
              echo "::error::Push failed"
              echo "::endgroup::"
              continue
            fi

            docker rmi "$image" "$new_image" || true
            pushed=$((pushed + 1))
            df -hT / | awk 'NR==1 || NR==2'
            echo "::endgroup::"
          done

          # ---------- Summary ----------
          {
            echo "## Docker Sync Summary (digest based)"
            echo ""
            echo "| Status | Count |"
            echo "|---|---|"
            echo "| Pushed (changed/new)      | $pushed |"
            echo "| Skipped (digest identical)| $skipped |"
            echo "| Failed                    | ${#failed[@]} |"
            echo "| FORCE_PUSH                | $FORCE_PUSH |"
            if (( ${#failed[@]} > 0 )); then
              echo ""
              echo "### Failed images"
              for img in "${failed[@]}"; do echo "- \`$img\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failed[@]} > 0 )); then
            echo "::error::${#failed[@]} image(s) failed, see summary."
            exit 1
          fi
