name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # 时区注意：GitHub Actions 使用 UTC 时间，北京时间需要减 8 小时
  # 想要北京时间 21:00 运行 → 设置 UTC 13:00
  schedule:
    - cron: '0 13 * * *'

# 避免 push 与 schedule 同时触发时重复运行
concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  PARALLEL: "8"   # 并发数，可根据 runner 网络情况调整（一般 6~12）

jobs:
  sync:
    name: Sync images (skopeo, parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Sync images to Aliyun
        run: |
          set -euo pipefail

          # ========= 1. 登录目标仓库 =========
          echo "$ALIYUN_REGISTRY_PASSWORD" \
            | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

          # ========= 2. 读取 images.txt（过滤空行和注释） =========
          mapfile -t lines < <(grep -vE '^[[:space:]]*(#|$)' images.txt || true)
          echo "共读取到 ${#lines[@]} 个镜像"

          # ========= 3. 第一遍：检测重名（跨命名空间同名镜像） =========
          declare -A ns_of_image
          declare -A duplicate_images

          for line in "${lines[@]}"; do
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"
            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            key="${image_name}"
            if [[ -n "${ns_of_image[$key]:-}" ]]; then
              if [[ "${ns_of_image[$key]}" != "${name_space}_" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$key]=1
              fi
            else
              ns_of_image[$key]="${name_space}_"   # 加 _ 确保非空，便于判断
            fi
          done

          # ========= 4. 第二遍：生成任务清单 src|dst|platform =========
          : > /tmp/tasks.txt
          for line in "${lines[@]}"; do
            platform=$(echo "$line" \
              | awk -F'--platform[ =]' '{if (NF>1) print $2}' \
              | awk '{print $1}')
            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"
            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            # 平台前缀
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              platform_prefix="${platform//\//_}_"
            fi

            # 重名且命名空间非空 → 命名空间前缀
            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            image_name_tag="${image_name_tag%%@*}"   # 去掉 @sha256
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "$image|$new_image|$platform" >> /tmp/tasks.txt
          done

          echo "==================== 任务清单 ===================="
          cat /tmp/tasks.txt
          echo "=================================================="

          # ========= 5. 定义单个同步函数 =========
          sync_one() {
            local line="$1"
            local src dst platform p_os p_arch p_variant
            IFS='|' read -r src dst platform <<< "$line"

            echo ">>> [START] $src  ->  $dst"
            local args=(--retry-times 3)

            if [[ -n "$platform" ]]; then
              IFS='/' read -r p_os p_arch p_variant <<< "$platform"
              args+=(--override-os "$p_os" --override-arch "$p_arch")
              [[ -n "$p_variant" ]] && args+=(--override-variant "$p_variant")
            fi

            # skopeo 流式复制，不落盘，无需 docker daemon
            if skopeo copy "${args[@]}" "docker://$src" "docker://$dst"; then
              echo "<<< [DONE ] $src  ->  $dst"
            else
              echo "!!! [FAIL ] $src  ->  $dst"
              return 1
            fi
          }
          export -f sync_one

          # ========= 6. 并行执行 =========
          if ! xargs -P "$PARALLEL" -I{} bash -c 'sync_one "$@"' _ {} < /tmp/tasks.txt; then
            echo "::error::部分镜像同步失败，请查看上方日志"
            exit 1
          fi

          echo "::notice::全部镜像同步完成"
