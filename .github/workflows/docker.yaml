name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # 时区注意：GitHub Actions 使用 UTC，北京时间 = UTC + 8
  # 想要北京时间 21:00 运行 → UTC 13:00
  schedule:
    - cron: '0 13 * * *'

# 最小权限
permissions:
  contents: read

# 防止定时任务和 push 触发的运行撞车
concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  sync:
    name: Sync images to Aliyun
    # 固定 22.04 而非 latest，避免 24.04 与 maximize-build-space 的兼容问题
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          # 空间仍不够时按需开启
          # remove-android: 'true'
          # remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      - name: Restart docker
        run: sudo service docker restart

      - name: Show disk space after resize
        run: df -hT /

      - name: Checkout
        uses: actions/checkout@v4

      # 用官方 action 登录，避免密码出现在命令行/日志中
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull / Tag / Push images
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local -i n=0 max=3
            until "$@"; do
              ((n++)) || true
              if (( n >= max )); then
                echo "::error::Command failed after $max attempts: $*"
                return 1
              fi
              echo "Retry $n/$max: $*"
              sleep 5
            done
          }

          # ---------- 一次性读取 images.txt ----------
          lines=()
          while IFS= read -r line || [[ -n "$line" ]]; do
            # 忽略空行（含只有空白的行）与注释行
            [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
            lines+=("$line")
          done < images.txt

          if (( ${#lines[@]} == 0 )); then
            echo "No images to process."
            exit 0
          fi

          # ---------- 第一遍：检测镜像名重名 ----------
          declare -A first_ns duplicate
          for line in "${lines[@]}"; do
            image=$(awk '{print $NF}' <<< "$line")
            image="${image%%@*}"                    # 去掉 @sha256:...
            image_name_tag="${image##*/}"
            image_name="${image_name_tag%%:*}"

            IFS='/' read -r -a parts <<< "$image"
            case "${#parts[@]}" in
              3) name_space="${parts[1]}" ;;        # kasmweb/nginx:xx
              2) name_space="${parts[0]}" ;;        # nginx:xx
              *) name_space="" ;;                   # 无命名空间
            esac

            if [[ -n "${first_ns[$image_name]+x}" ]]; then
              if [[ "${first_ns[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate[$image_name]=1
              fi
            else
              first_ns[$image_name]="$name_space"
            fi
          done

          # ---------- 第二遍：拉取 → 重命名 → 推送 ----------
          for line in "${lines[@]}"; do
            echo "::group::Processing $line"

            # 解析 --platform（支持 `--platform x` 与 `--platform=x`）
            platform=""
            if [[ "$line" =~ --platform[=\ ]([^ ]+) ]]; then
              platform="${BASH_REMATCH[1]}"
            fi
            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"

            image=$(awk '{print $NF}' <<< "$line")
            image_clean="${image%%@*}"
            image_name_tag="${image_clean##*/}"
            image_name="${image_name_tag%%:*}"

            IFS='/' read -r -a parts <<< "$image_clean"
            case "${#parts[@]}" in
              3) name_space="${parts[1]}" ;;
              2) name_space="${parts[0]}" ;;
              *) name_space="" ;;
            esac

            name_space_prefix=""
            if [[ -n "${duplicate[$image_name]:-}" && -n "$name_space" ]]; then
              name_space_prefix="${name_space}_"
            fi

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "Pull: $image"
            if [[ -n "$platform" ]]; then
              retry docker pull --platform "$platform" "$image"
            else
              retry docker pull "$image"
            fi

            echo "Tag:  $image -> $new_image"
            docker tag "$image" "$new_image"

            echo "Push: $new_image"
            retry docker push "$new_image"

            # 清理（多标签场景下 rmi 可能失败，忽略）
            docker rmi "$image" "$new_image" || true

            echo "Disk usage:"
            df -hT / | awk 'NR==1 || NR==2'
            echo "::endgroup::"
          done
