name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    # 注意：GitHub Actions 用 UTC。北京时间 21:00 = UTC 13:00
    - cron: '0 13 * * *'

concurrency:
  group: docker-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  sync:
    name: Sync Images (skopeo)
    runs-on: ubuntu-latest
    timeout-minutes: 180   # skopeo 直接 registry-to-registry，比 docker pull/push 快很多，3 小时足够

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Aliyun (docker login，skopeo 自动复用凭证)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Sync images
        env:
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
        run: |
          set -uo pipefail

          # ---------- 解析工具函数 ----------
          get_image()    { awk '{print $NF}' <<< "$1"; }
          get_platform() { awk -F'--platform[ =]' '{if (NF>1) print $2}' <<< "$1" | awk '{print $1}'; }

          # 过滤注释/空行
          grep -Ev '^[[:space:]]*(#|$)' images.txt > /tmp/images.clean || true

          # ---------- Pass 1：检测跨命名空间同名镜像 ----------
          declare -A ns_map=() duplicates=()
          while IFS= read -r line; do
            image=$(get_image "$line"); image="${image%%@*}"
            name_tag="${image##*/}"
            name="${name_tag%%:*}"
            ns="${image%/*}"; [[ "$ns" == "$image" ]] && ns=""
            ns="${ns:-}_"
            if [[ -n "${ns_map[$name]:-}" ]]; then
              [[ "${ns_map[$name]}" != "$ns" ]] && duplicates[$name]=1
            else
              ns_map[$name]="$ns"
            fi
          done < /tmp/images.clean

          # ---------- Pass 2：skopeo copy ----------
          total=$(wc -l < /tmp/images.clean)
          idx=0; failures=0

          while IFS= read -r line; do
            idx=$((idx+1))
            image=$(get_image "$line"); image="${image%%@*}"
            platform=$(get_platform "$line")

            # 解析目标名称
            name_tag="${image##*/}"
            name="${name_tag%%:*}"
            ns="${image%/*}"; [[ "$ns" == "$image" ]] && ns=""

            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"
            ns_prefix=""
            [[ -n "${duplicates[$name]:-}" && -n "$ns" ]] && ns_prefix="${ns}_"

            dst="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${ns_prefix}${name_tag}"

            echo "::group::[$idx/$total] $image -> $dst"

            # 构建 skopeo copy 参数
            skopeo_args=(copy --retry-times 3 --insecure-policy)

            if [[ -n "$platform" ]]; then
              # 单架构：--platform 格式为 os/arch[/variant]，例如 linux/amd64
              os="${platform%%/*}"
              arch="${platform#*/}"; arch="${arch%%/*}"
              variant=""
              [[ "$platform" == */*/* ]] && variant="${platform##*/}"

              skopeo_args+=(--override-os "$os" --override-arch "$arch")
              [[ -n "$variant" ]] && skopeo_args+=(--override-variant "$variant")
            else
              # 无 --platform 行：复制全部架构（--all）
              skopeo_args+=(--all)
            fi

            if ! skopeo "${skopeo_args[@]}" "docker://$image" "docker://$dst"; then
              echo "::error::skopeo copy failed: $image -> $dst"
              failures=$((failures+1))
            fi

            echo "::endgroup::"
          done < /tmp/images.clean

          echo "======================================"
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures image(s) failed"
            exit 1
          fi
          echo "All $total image(s) synced successfully"
