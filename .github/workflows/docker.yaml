name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 13 * * *'

concurrency:
  group: docker-sync
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
  # 可选：填了就走认证，彻底解决 Docker Hub 限流
  DOCKERHUB_USER: "${{ secrets.DOCKERHUB_USER }}"
  DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
  PARALLEL: "6"          # 降到 6，减轻 ACR 分块上传压力
  RETRY_TIMES: "5"

jobs:
  sync:
    name: Sync images (skopeo, parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Sync images to Aliyun
        run: |
          set -euo pipefail

          # ===== 1. 登录 =====
          echo "$ALIYUN_REGISTRY_PASSWORD" \
            | skopeo login -u "$ALIYUN_REGISTRY_USER" --password-stdin "$ALIYUN_REGISTRY"

          if [[ -n "${DOCKERHUB_USER:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
            echo ">>> 登录 Docker Hub（解决 toomanyrequests）"
            echo "$DOCKERHUB_TOKEN" | skopeo login -u "$DOCKERHUB_USER" --password-stdin docker.io
            # docker.n8n.io 是 Docker Hub 代理，认证同源
            echo "$DOCKERHUB_TOKEN" | skopeo login -u "$DOCKERHUB_USER" --password-stdin docker.n8n.io || true
          else
            echo "::warning::未配置 DOCKERHUB_USER/TOKEN，docker.io 可能触发限流"
          fi

          # ===== 2. 读取 images.txt =====
          mapfile -t lines < <(grep -vE '^[[:space:]]*(#|$)' images.txt || true)
          echo "共读取到 ${#lines[@]} 个镜像"

          # ===== 3. 重名检测 =====
          declare -A ns_of_image
          declare -A duplicate_images
          for line in "${lines[@]}"; do
            image=$(echo "$line" | awk '{print $NF}'); image="${image%%@*}"
            image_name_tag="${image##*/}"; image_name="${image_name_tag%%:*}"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            key="${image_name}"
            if [[ -n "${ns_of_image[$key]:-}" ]]; then
              [[ "${ns_of_image[$key]}" != "${name_space}_" ]] && duplicate_images[$key]=1
            else
              ns_of_image[$key]="${name_space}_"
            fi
          done

          # ===== 4. 生成任务清单 =====
          : > /tmp/tasks.txt
          for line in "${lines[@]}"; do
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            image=$(echo "$line" | awk '{print $NF}')
            image_name_tag="${image##*/}"; image_name="${image_name_tag%%:*}"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            platform_prefix=""
            [[ -n "$platform" ]] && platform_prefix="${platform//\//_}_"

            name_space_prefix=""
            [[ -n "${duplicate_images[$image_name]:-}" && -n "$name_space" ]] && name_space_prefix="${name_space}_"

            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${platform_prefix}${name_space_prefix}${image_name_tag}"

            echo "$image|$new_image|$platform" >> /tmp/tasks.txt
          done

          echo "==================== 任务清单 ===================="
          cat /tmp/tasks.txt
          echo "=================================================="

          # ===== 5. 单任务函数（日志独立文件，避免交错）=====
          mkdir -p /tmp/logs
          sync_one() {
            local line="$1"
            local src dst platform p_os p_arch p_variant
            IFS='|' read -r src dst platform <<< "$line"

            local safe; safe=$(echo "$src" | tr '/:@' '___')
            local log="/tmp/logs/${safe}.log"

            {
              echo ">>> [START] $src  ->  $dst"
              local args=(--retry-times "$RETRY_TIMES")
              # 关键：强制重新压缩，缓解阿里云 ACR 的 blob type invalid
              args+=(--dest-compress --dest-compress-format gzip)

              if [[ -n "$platform" ]]; then
                IFS='/' read -r p_os p_arch p_variant <<< "$platform"
                args+=(--override-os "$p_os" --override-arch "$p_arch")
                [[ -n "$p_variant" ]] && args+=(--override-variant "$p_variant")
              fi

              echo "cmd: skopeo copy ${args[*]} docker://$src docker://$dst"
              skopeo copy "${args[@]}" "docker://$src" "docker://$dst"
              echo "<<< [DONE ] $src  ->  $dst"
            } > "$log" 2>&1

            local rc=$?
            if [[ $rc -ne 0 ]]; then
              echo "!!! [FAIL ] $src  ->  $dst  (log: $log)"
            else
              echo "<<< [DONE ] $src  ->  $dst"
            fi
            return $rc
          }
          export -f sync_one
          export RETRY_TIMES

          # ===== 6. 并行执行，收集失败 =====
          set +e
          xargs -P "$PARALLEL" -I{} bash -c 'sync_one "$@"' _ {} < /tmp/tasks.txt
          xargs_rc=$?
          set -e

          # ===== 7. 汇总 =====
          echo "==================== 失败日志 ===================="
          failed=0
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            src=$(echo "$line" | awk -F'|' '{print $1}')
            safe=$(echo "$src" | tr '/:@' '___')
            log="/tmp/logs/${safe}.log"
            if [[ -f "$log" ]] && ! grep -q '<<< \[DONE \]' "$log"; then
              failed=$((failed+1))
              echo "----- FAILED: $src -----"
              tail -n 30 "$log"
              echo
            fi
          done < /tmp/tasks.txt

          echo "==================== 汇总 ===================="
          total=$(grep -c . /tmp/tasks.txt || true)
          echo "总数: $total, 失败: $failed"

          if [[ $failed -gt 0 || $xargs_rc -ne 0 ]]; then
            echo "::error::有 $failed 个镜像同步失败，详见上方日志"
            exit 1
          fi
          echo "::notice::全部 $total 个镜像同步完成"
